[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenlattice"
version = "1.0.0"
description = "A provenance-aware code and engineering-knowledge graph research core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-c>=0.24,<0.25",
    "tree-sitter-cpp>=0.23,<0.24",
]

[project.scripts]
provenlattice = "provenlattice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The vocabularies are data, not code: without this a wheel installs the
# semantics package and then fails to load any language at runtime.
[tool.setuptools.package-data]
"provenlattice.semantics" = ["*.toml", "vocabularies/*.toml"]
